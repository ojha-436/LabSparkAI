org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official

# Speed-up flags — parallel workers + build cache + configuration cache.
# These take 30-40% off subsequent build times on multi-core Macs.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# NOTE: configuration-cache disabled — AGP 8.11 + Kotlin 2.2 currently
# throw "KotlinBaseApiPlugin has not been used" when it's on. Safe to
# re-enable once AGP 8.12+ ships.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
